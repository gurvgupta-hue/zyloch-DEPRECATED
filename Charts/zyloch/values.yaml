zyloch-backend:
  fullnameOverride: zyloch-backend
  image:
    repository: us-central1-docker.pkg.dev/secure-code-dev/zyloch/zyloch-backend
    tag: "9242025"
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: production
    # - name: MONGO_URI
    #   value: mongodb://admin:password123@zyloch-mongodb:27017/zyloch?authSource=admin
    # - name: FRONTEND_URL
    #   value: http://zyloch-frontend:3000
    # - name: GITHUB_CLIENT_ID
    #   value: __GITHUB_CLIENT_ID__
    # - name: GITHUB_CLIENT_SECRET
    #   value: __GITHUB_CLIENT_SECRET__
    # - name: GITHUB_WEBHOOK_SECRET
    #   value: __GITHUB_WEBHOOK_SECRET__
    # - name: JWT_SECRET
    #   value: __JWT_SECRET__
  service:
    port: 5000
  useStatefulSet: true
  statefulSetData:
    logs:
      mountPath: /app/logs


zyloch-policy-scanner:
  fullnameOverride: zyloch-policy-scanner
  image:
    repository: us-central1-docker.pkg.dev/secure-code-dev/zyloch/zyloch-scanner
    tag: "9212025"
  env: []
    # - name: MONGODB_URL
    #   value: mongodb://admin:password@zyloch-mongodb:27017/admin
    # - name: DATABASE_NAME
    #   value: policy_scanner
    # - name: GITHUB_WEBHOOK_SECRET
    #   value: __GITHUB_WEBHOOK_SECRET__
    # - name: GITHUB_APP_PRIVATE_KEY
    #   value: __GITHUB_APP_PRIVATE_KEY__
    # - name: GITHUB_APP_ID
    #   value: __GITHUB_APP_ID__
  service:
    port: 8000
  statefulSetData:
    repos:
      mountPath: /app/repos
    output:
      mountPath: /app/output


