{{ range $i, $v := .Values.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "gateways.fullname" $ }}-{{ $i }}
  labels:
    {{- include "gateways.labels" $ | nindent 4 }}
spec:
  {{- with $v.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  hostnames:
    - {{ $v.hostname }}
  {{- with $v.rules }}
  rules:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
